[workspace]
resolver = "3"
members = ["crates/cli", "crates/protocol", "crates/server"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rustyline = "18"
ctrlc = "3"
crc32fast = "1"
